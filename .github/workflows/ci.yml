name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  ci:
    name: Type Check · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@11.8.0

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm run type-check

      - name: ESLint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/bemytraveller_test
          AUTH_SECRET: ci-build-secret-stub-32-characters!!
          NEXT_PUBLIC_APP_URL: https://bemytraveller.com
          NEXT_PUBLIC_APP_NAME: "Be My Traveller"
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          SEED_SECRET: ci-seed-secret-stub
          BMT_ADMIN_EMAIL: admin@test.com
          BMT_ADMIN_PASSWORD: test-password-stub
