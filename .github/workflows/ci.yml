name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  ci:
    name: Type Check · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: bemytraveller/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: bemytraveller
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript type check
        working-directory: bemytraveller
        run: pnpm run type-check

      - name: ESLint
        working-directory: bemytraveller
        run: pnpm run lint

      - name: Build
        working-directory: bemytraveller
        run: pnpm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/bemytraveller_test
          AUTH_SECRET: ci-build-secret-stub-32-characters!!
          NEXT_PUBLIC_R2_PUBLIC_URL: https://cdn.example.com
          R2_ACCOUNT_ID: test
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          CLOUDINARY_URL: cloudinary://test:test@test
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: test
